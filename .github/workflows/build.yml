name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Install Cordova
        run: npm install -g cordova@12

      - name: Assemble project from flat repo files
        run: |
          mkdir -p plugin/www plugin/res/xml plugin/src/android
          cp plugin.xml plugin/plugin.xml
          echo '{"name":"cordova-plugin-smspayment","version":"1.0.0","cordova":{"id":"cordova-plugin-smspayment","platforms":["android"]}}' > plugin/package.json
          cp smspayment.js plugin/www/
          cp smspay_paths.xml plugin/res/xml/
          cp SmsPaymentPlugin.java SmsReceiver.java plugin/src/android/

          cordova create app com.ankit.khata "Rental Khata"
          cp config.xml app/config.xml
          cp index.html app/www/index.html

          cd app
          cordova platform add android@13
          cordova plugin add ../plugin

      - name: Build debug APK
        run: |
          cd app
          cordova build android --debug

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/platforms/android/app/build/outputs/apk/debug/app-debug.apk out/RentalKhata.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RentalKhata-apk
          path: out/RentalKhata.apk

      - name: Publish release (direct APK download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: out/RentalKhata.apk
